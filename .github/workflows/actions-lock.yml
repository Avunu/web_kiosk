name: Actions lock

# Checks that .github/workflows/actions.lock matches the actions the workflows use. It is a separate
# workflow, so a lock failure never affects the other workflows, including any that another workflow calls.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify the actions lockfile
        run: gh actions-lock --verify
