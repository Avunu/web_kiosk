version: 2
updates:
  # The pinned actions of the workflows in .github/workflows, the shared documentation check of
  # Avunu/site-docs (docs.yml) among them. A person reviews these pull requests (see the auto-merge
  # workflow, if any).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - Avunu/site-docs
    groups:
      docs-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
